name: Build CSM Deauther

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz \
            | tar -xz -C /usr/local/bin arduino-cli
          arduino-cli version

      - name: Install Spacehuhn Deauther board package
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/SpacehuhnTech/arduino/main/package_spacehuhn_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@2.7.4
          arduino-cli core install deauther:esp8266

      - name: Rename sketch file
        run: |
          mkdir -p CSM_Deauther
          cp dea.txt CSM_Deauther/CSM_Deauther.ino

      - name: Compile with Spacehuhn SDK
        run: |
          arduino-cli compile \
            --fqbn deauther:esp8266:nodemcu \
            --output-dir build/ \
            CSM_Deauther/CSM_Deauther.ino

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSM_Deauther_bin
          path: build/*.bin
